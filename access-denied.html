<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access Denied</title>
    <style>
      :root {
        --color-primary: #0052d9;
        --color-bg: #f5f6fa;
        --color-card: #ffffff;
        --color-border: #e4e7ed;
        --color-text: #111827;
        --color-text-muted: #6b7280;
        --shadow-card: 0 1px 3px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.06);
        --radius-lg: 16px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
      }

      .denied-card {
        width: 100%;
        max-width: 400px;
        background: var(--color-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        padding: 40px 36px;
        text-align: center;
      }

      .denied-card h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .denied-card p {
        margin: 0;
        font-size: 14px;
        color: var(--color-text-muted);
        line-height: 1.5;
      }

      .debug-details {
        display: none;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--color-border);
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          monospace;
        font-size: 12px;
        line-height: 1.5;
        color: var(--color-text-muted);
        overflow-wrap: anywhere;
      }

      .debug-details.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="denied-card">
      <h1>Access Denied</h1>
      <p>Your account could not be verified. Contact your IT administrator.</p>
      <div id="debug-details" class="debug-details"></div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const debugEl = document.getElementById('debug-details');
      if (params.has('reason')) {
        debugEl.classList.add('is-visible');
        debugEl.textContent = [...params.entries()]
          .map(([key, value]) => `${key}: ${value}`)
          .join('\n');
      }
    </script>
  </body>
</html>
